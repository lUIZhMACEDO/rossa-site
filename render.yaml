services:
  - type: web
    name: rossa-site
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "ROSSA (Team 51 demo)"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_SEED
        generateValue: true
      - key: APP_TRUSTED_HOST
        value: onrender.com
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_ENABLE_REGISTRATION
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: rossa-db
          property: connectionString
      - key: DB_URL_impc
        fromDatabase:
          name: rossa-db
          property: connectionString

databases:
  - name: rossa-db
    plan: free
    databaseName: rossa
    user: rossa
